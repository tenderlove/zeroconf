name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}-latest

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos]
        ruby: [ head, 3.2  ]

    steps:
      - uses: actions/checkout@v3
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Enable multicast routing (macOS)
        if: runner.os == 'macOS'
        run: |
          IFACE=$(route -n get default 2>/dev/null | awk '/interface:/{print $2}')
          [ -n "$IFACE" ] && sudo route -q -n add -net 224.0.0.0/4 -interface "$IFACE" || true

      - name: Install dependencies
        run: bundle install
      - name: Run tests
        run: bundle exec rake test
