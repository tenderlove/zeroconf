name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}-latest

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos]
        ruby: [ head, 3.2  ]

    steps:
      - uses: actions/checkout@v3
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Enable multicast routing (macOS)
        if: runner.os == 'macOS'
        run: |
          # Find the same IPv4 interface that ZeroConf::Utils would select
          IFACE=$(ruby -e "
            require 'socket'
            ifa = Socket.getifaddrs.find { |ifa|
              ifa.addr&.ipv4? &&
                (ifa.flags & Socket::IFF_UP > 0) &&
                (ifa.flags & Socket::IFF_MULTICAST > 0) &&
                (ifa.flags & Socket::IFF_POINTOPOINT == 0) &&
                (ifa.flags & Socket::IFF_LOOPBACK == 0) &&
                !ifa.addr.ip_address.start_with?('169.254')
            }
            puts ifa.name if ifa
          ")
          echo "Configuring multicast via interface: $IFACE"
          if [ -n "$IFACE" ]; then
            sudo route -q -n delete -net 224.0.0.0/4 2>/dev/null || true
            sudo route -q -n add -net 224.0.0.0/4 -interface "$IFACE" || true
          fi

      - name: Install dependencies
        run: bundle install
      - name: Run tests
        run: bundle exec rake test
